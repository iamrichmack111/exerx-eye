[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ExerxEye"
version = "1.2.0"
description = "Flask exercise intelligence with private accounts, workout tracking, motion UI, analytics, and exports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4"]
authors = [{name = "Jeremy Franklin"}]
license = {text = "MIT"}
keywords = ["flask", "sqlite", "fitness", "workout", "exercise"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Database :: Front-Ends",
]

[project.optional-dependencies]
tui = ["textual>=0.70", "rich>=13.7"]

[project.scripts]
exerx-eye = "exerx_eye.cli:main"

[tool.setuptools.packages.find]
include = ["exerx_eye*"]
