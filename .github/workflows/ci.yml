name: CI + Playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Python tests
        run: pytest -q

      - name: Generate Playwright screenshots
        env:
          EXERXEYE_SECRET: github-actions-secret
        run: npx playwright test tests/screenshots.spec.cjs --project=chromium

      - name: Verify screenshots
        run: |
          test -s screenshots/01-exercise-library.png
          test -s screenshots/02-exercise-library-dark.png
          test -s screenshots/03-login.png
          test -s screenshots/04-signup.png
          file screenshots/*.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exerx-eye-screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
