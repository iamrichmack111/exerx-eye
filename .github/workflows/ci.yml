name: CI + Playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EXERXEYE_SECRET: github-actions-web-test-secret
      FLASK_SECRET_KEY: github-actions-web-test-secret
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Flask web dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest

      - name: Install Playwright
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Compile Flask app
        run: |
          python -m py_compile app.py
          python -m compileall -q exerx_eye

      - name: Run Python tests
        run: pytest -q

      - name: Run Playwright web tests
        run: npx playwright test --project=chromium

      - name: Verify README screenshots
        run: |
          test -s screenshots/01-exercise-library.png
          test -s screenshots/02-exercise-library-dark.png
          test -s screenshots/03-login.png
          test -s screenshots/04-signup.png
          file screenshots/*.png

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exerx-eye-playwright-screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exerx-eye-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
