name: HQ Piper Demo

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the MP4 to (blank = latest release)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      EXERXEYE_SECRET: demo-render-secret
      FLASK_SECRET_KEY: demo-render-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Flask web dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build 1080p Ryan High narrated demo
        env:
          DEMO_SKIP_SETUP: "1"
          DEMO_PYTHON: python3
        run: bash demo/build_demo.sh

      - name: Verify demo
        run: |
          test -s DEMOS/exerx-eye-v10-piper-hq-demo.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of default=nw=1 DEMOS/exerx-eye-v10-piper-hq-demo.mp4

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: exerx-eye-v10-piper-hq-demo
          path: DEMOS/exerx-eye-v10-piper-hq-demo.mp4
          if-no-files-found: error

      - name: Attach demo to release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --json tagName --jq .tagName)"
          fi
          echo "Uploading demo to release $TAG"
          gh release upload "$TAG" DEMOS/exerx-eye-v10-piper-hq-demo.mp4 --clobber
